# A COPY of the landing's site file on the server: /etc/nginx/sites-available/therooks.ru.
# CI does not apply it: the deploy key can only rsync into /var/www/landing. After changing this file here,
# install it on the server by hand (back up the old one, run "nginx -t", then reload nginx).
# The same live file stays the source of truth: if the two differ, the server wins.
# Landing page: static files in /var/www/landing (stub until the first landing deploy)
server {
    listen 80;
    listen [::]:80;
    server_name therooks.ru;
    # do not show the nginx version in the Server header and on error pages
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name therooks.ru;
    # do not show the nginx version in the Server header and on error pages
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/therooks.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/therooks.ru/privkey.pem;
    include snippets/tls-params.conf;

    # Security headers. The page has no scripts and no inline styles, fonts and CSS are its own files.
    # These are set at server level: a location below must not add its own add_header, or these would be dropped there.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    root /var/www/landing;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
